<!DOCTYPE html>
<html>
<head><title>Student Records</title></head>
<body>
  <h1>Student Records</h1>
  <table border="1" cellpadding="8">
    <tr><th>Name</th><th>Email</th><th>Course</th><th>Year</th></tr>
    {% for s in students %}
    <tr><td>{{ s.name }}</td><td>{{ s.email }}</td><td>{{ s.course }}</td><td>{{ s.year }}</td></tr>
    {% empty %}
    <tr><td colspan="4">No students yet.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
